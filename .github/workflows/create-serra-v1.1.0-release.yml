name: Create SERRA v1.1.0 release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/create-serra-v1.1.0-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create v1.1.0 release if absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.1.0 already exists; nothing to do."
            exit 0
          fi
          gh release create v1.1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v1.1.0 — SERRA submission reproducibility release" \
            --notes-file RELEASE_NOTES_v1.1.0.md
