name: Query Zenodo DOI v1.1.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/query-zenodo-v1.1.0.yml'

permissions:
  contents: read

jobs:
  query-doi:
    runs-on: ubuntu-latest
    steps:
      - name: Query DataCite for Zenodo v1.1.0 DOI
        shell: bash
        run: |
          set -euo pipefail
          title='Surrogate inference for threshold-derived environmental indices depends on null placement and seasonal event concentration'
          for attempt in $(seq 1 12); do
            echo "Attempt ${attempt}: querying DataCite..."
            json=$(curl -fsSLG 'https://api.datacite.org/dois' \
              --data-urlencode 'client-id=cern.zenodo' \
              --data-urlencode "query=titles.title:\"${title}\"" \
              --data-urlencode 'page[size]=20')
            doi=$(printf '%s' "$json" | jq -r '.data[]?.attributes | select(.version == "1.1.0") | .doi' | head -n1)
            if [ -n "$doi" ] && [ "$doi" != "null" ]; then
              echo "ZENODO_V1_1_0_DOI=${doi}"
              exit 0
            fi
            echo "No v1.1.0 DOI registered yet."
            sleep 10
          done
          echo 'No matching v1.1.0 DOI found in DataCite after polling.' >&2
          exit 1
